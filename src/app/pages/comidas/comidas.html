<section class="container py-5">
  <h1 class="text-center mb-4">Comidas</h1>

  <div class="row mb-4">
    <div class="col-md-6">
      <input class="form-control" [(ngModel)]="busqueda" placeholder="Buscar por nombre">
    </div>
    <div class="col-md-6">
      <button class="btn btn-success me-2" (click)="buscarPorNombre()">Buscar</button>
      <button class="btn btn-secondary me-2" (click)="limpiarBusqueda()">Limpiar</button>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-md-6">
      <input class="form-control" [(ngModel)]="ingrediente" placeholder="Buscar por ingrediente">
    </div>
    <div class="col-md-6">
      <button class="btn btn-warning" (click)="buscarPorIngrediente()">Buscar ingrediente</button>
    </div>
  </div>

  <p *ngIf="cargando" class="text-center">Cargando comidas...</p>
  <p *ngIf="mensaje" class="text-center">{{ mensaje }}</p>

  <div class="row g-4">
    <div class="col-md-4" *ngFor="let comida of comidas">
      <div class="card h-100">
        <img [src]="comida.strMealThumb" class="card-img-top" [alt]="comida.strMeal">
        <div class="card-body">
          <h5 class="card-title">{{ comida.strMeal }}</h5>
          <p class="fw-bold">$ {{ comida.precio }}</p>
          <button class="btn btn-dark" (click)="verIngredientes(comida)">
            {{ comida.mostrarIngredientes ? 'Ocultar ingredientes' : 'Ver ingredientes' }}
          </button>

          <ul class="mt-3" *ngIf="comida.mostrarIngredientes">
            <li *ngFor="let ing of comida.ingredientes">{{ ing }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
