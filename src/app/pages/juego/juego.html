<section class="container py-5 text-center">
  <h1>Juego de memoria</h1>
  <p>Encuentra las parejas de comida y bebida.</p>

  <div class="text-center mb-4">
    <button class="btn btn-primary me-2" (click)="nuevaPartida()">Nueva partida</button>
    <button class="btn btn-secondary" (click)="nuevaPartida()">Reiniciar partida</button>
  </div>

  <div class="mb-3">
    <strong>Movimientos:</strong> {{ movimientos }} |
    <strong>Parejas:</strong> {{ parejas }}/8
  </div>

  <div class="d-grid juego-grid">
    <button
      class="carta"
      *ngFor="let carta of cartas"
      (click)="seleccionar(carta)"
      [disabled]="carta.abierta || carta.encontrada || bloqueado"
      [class.encontrada]="carta.encontrada">

      <img *ngIf="carta.abierta || carta.encontrada" [src]="carta.imagen" alt="carta">
      <span *ngIf="!carta.abierta && !carta.encontrada">M</span>
    </button>
  </div>

  <div *ngIf="terminado" class="mt-4 p-4 bg-white rounded shadow-sm">
    <h3>¡Ganaste!</h3>
    <button class="btn btn-success" (click)="nuevaPartida()">Jugar otra vez</button>
  </div>
</section>
